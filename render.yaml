# One-click deploy of the hosted (Streamable HTTP) server on Render.
# After deploying, set TINYFISH_API_KEY in the dashboard. STACKS_HTTP_TOKEN is
# generated for you: your MCP URL is https://<service>.onrender.com/mcp/<token>
services:
  - type: web
    name: stacks-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TINYFISH_API_KEY
        sync: false
      - key: STACKS_HTTP_TOKEN
        generateValue: true
      - key: STACKS_DEFAULT_LIBRARY
        value: tpl
